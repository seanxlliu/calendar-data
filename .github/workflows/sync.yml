# 放在 calendar-data 仓库 里：.github/workflows/sync.yml
# 同一个仓库的根目录还要放 sync.py
# 每 30 分钟把 iCloud / Outlook 的公开日历同步成 icloud.json / outlook.json
name: sync
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install --quiet icalendar recurring-ical-events
      - name: 同步
        run: python3 sync.py
      - name: 保存结果
        run: |
          git add -A .
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git config user.name "calendar-sync"
          git config user.email "calendar-sync@users.noreply.github.com"
          git commit -q -m "sync calendars"
          git pull -q --rebase
          git push -q
